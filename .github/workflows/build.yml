name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle downloads and validates gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
